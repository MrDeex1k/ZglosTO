name: Pomysł lub propozycja funkcji
description: Zaproponuj niewrażliwą zmianę produktu, architektury albo dokumentacji.
title: 'idea: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Większe funkcje, zmiany architektury i nowe zależności omawiamy przed implementacją.
        Sam pomysł nie wymaga CLA, ale kod lub inne chronione materiały w PR już mogą go wymagać.
  - type: dropdown
    id: area
    attributes:
      label: Obszar
      options:
        - Mobile
        - WEB
        - Backend
        - Infrastructure
        - Shared
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem użytkownika lub organizacji
      description: Opisz potrzebę bez danych konkretnego mieszkańca lub klienta.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proponowane rozwiązanie
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Rozważone alternatywy
  - type: textarea
    id: impact
    attributes:
      label: Wpływ
      description: Uwzględnij bezpieczeństwo, prywatność, dostępność, White-Label, API i utrzymanie.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Zakres
      options:
        - label: Propozycja nie zawiera podatności, sekretów, PII ani poufnych materiałów klienta.
          required: true
