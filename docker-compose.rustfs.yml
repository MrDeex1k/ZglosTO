services:
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5
    restart: unless-stopped
    environment:
      # Provider-specific names remain inside this local infrastructure override.
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_OBS_LOG_DIRECTORY: ''
      RUSTFS_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9000/health/ready']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - internal-net

  backend:
    environment:
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://uploads.127.0.0.1.nip.io:1235}
      S3_UPLOAD_EXPIRY_SECONDS: ${S3_UPLOAD_EXPIRY_SECONDS:-300}
    depends_on:
      rustfs:
        condition: service_healthy

  media_worker:
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  rustfs-data:
    driver: local
