services:
  rustfs:
    image: rustfs/rustfs:1.0.5
    restart: unless-stopped
    environment:
      # Provider-specific names remain inside this local infrastructure override.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_ACCESS_KEY:?RUSTFS_ROOT_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_SECRET_KEY:?RUSTFS_ROOT_SECRET_KEY is required}
      RUSTFS_REGION: ${S3_REGION:?S3_REGION is required}
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_OBS_LOG_DIRECTORY: ''
      RUSTFS_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9000/health/ready']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - internal-net

  backend:
    environment:
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://uploads.127.0.0.1.nip.io:1235}
      S3_UPLOAD_EXPIRY_SECONDS: ${S3_UPLOAD_EXPIRY_SECONDS:-300}
    depends_on:
      storage_provision:
        condition: service_completed_successfully

  media_worker:
    depends_on:
      storage_provision:
        condition: service_completed_successfully

  storage_provision:
    image: rustfs/rc:v0.1.37@sha256:7e93fd410a8fe51514f89373e093392c92095b98dc6140335fcfe956810c4c80
    restart: 'no'
    user: 10001:10001
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001,mode=0700']
    entrypoint: [sh, /provision/provision-storage-iam.sh]
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_OBJECT_PREFIX: ${S3_OBJECT_PREFIX:-incidents}
      RUSTFS_ROOT_ACCESS_KEY: ${RUSTFS_ROOT_ACCESS_KEY:?RUSTFS_ROOT_ACCESS_KEY is required}
      RUSTFS_ROOT_SECRET_KEY: ${RUSTFS_ROOT_SECRET_KEY:?RUSTFS_ROOT_SECRET_KEY is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_WORKER_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID:?S3_WORKER_ACCESS_KEY_ID is required}
      S3_WORKER_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY:?S3_WORKER_SECRET_ACCESS_KEY is required}
      S3_OPERATIONS_ACCESS_KEY_ID: ${S3_OPERATIONS_ACCESS_KEY_ID:?S3_OPERATIONS_ACCESS_KEY_ID is required}
      S3_OPERATIONS_SECRET_ACCESS_KEY: ${S3_OPERATIONS_SECRET_ACCESS_KEY:?S3_OPERATIONS_SECRET_ACCESS_KEY is required}
    volumes: [./scripts/provision-storage-iam.sh:/provision/provision-storage-iam.sh:ro]
    networks: [internal-net]
    depends_on:
      rustfs: { condition: service_healthy }
    pids_limit: 64
    mem_limit: 128m

volumes:
  rustfs-data:
    driver: local
