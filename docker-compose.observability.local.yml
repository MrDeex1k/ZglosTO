x-observability-hardening: &observability-hardening
  restart: always
  init: true
  pull_policy: missing
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m
  stop_grace_period: 30s
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: '5'

services:
  authorization:
    environment: &otel-app-environment
      OBSERVABILITY_MODE: local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-development}
      OTEL_SERVICE_NAME: authorization
  backend:
    environment:
      <<: *otel-app-environment
      OTEL_SERVICE_NAME: backend
  media_worker:
    command: [node, --import, '@zglosto/observability/register', dist/nest/media-worker/main.js]
    environment:
      <<: *otel-app-environment
      OTEL_SERVICE_NAME: media_worker
  llm_gateway:
    environment:
      <<: *otel-app-environment
      OTEL_SERVICE_NAME: llm_gateway

  otel-collector:
    <<: *observability-hardening
    image: otel/opentelemetry-collector-contrib:0.159.0
    user: 10001:10001
    command: [--config=/etc/otelcol-contrib/config.yaml]
    depends_on:
      loki: { condition: service_healthy }
      tempo: { condition: service_healthy }
    volumes:
      - ./observability/otel-collector-local.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [internal-net]
    healthcheck:
      test: [CMD, /otelcol-contrib, validate, --config=/etc/otelcol-contrib/config.yaml]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    pids_limit: 128
    cpus: 0.5
    mem_limit: 512m

  prometheus:
    <<: *observability-hardening
    image: prom/prometheus:v3.14.0
    user: 65534:65534
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-rules.yaml:/etc/prometheus/rules/zglosto.yaml:ro
      - prometheus-data:/prometheus
    networks: [internal-net]
    healthcheck:
      test: [CMD, /bin/promtool, check, ready, --url=http://127.0.0.1:9090]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    pids_limit: 128
    cpus: 0.5
    mem_limit: 512m

  loki:
    <<: *observability-hardening
    image: grafana/loki:3.7.6
    user: 10001:10001
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [internal-net]
    healthcheck:
      test: [CMD, /usr/bin/loki, -version]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    pids_limit: 128
    cpus: 0.5
    mem_limit: 512m

  tempo:
    <<: *observability-hardening
    image: grafana/tempo:3.0.3
    user: 10001:10001
    command: [-config.file=/etc/tempo/config.yaml]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    networks: [internal-net]
    healthcheck:
      test: [CMD, /tempo, -version]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    pids_limit: 128
    cpus: 0.5
    mem_limit: 512m

  alertmanager:
    <<: *observability-hardening
    image: prom/alertmanager:v0.34.0
    user: 65534:65534
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [internal-net]
    healthcheck:
      test: [CMD, /bin/wget, -q, -O, /dev/null, http://127.0.0.1:9093/-/ready]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    pids_limit: 128
    cpus: 0.25
    mem_limit: 256m

  grafana:
    <<: *observability-hardening
    image: grafana/grafana:13.2.0
    user: 472:472
    depends_on:
      loki: { condition: service_healthy }
      prometheus: { condition: service_healthy }
      tempo: { condition: service_healthy }
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SERVER_HTTP_PORT: '3000'
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets: [grafana_admin_password]
    networks: [internal-net]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/log/grafana:rw,noexec,nosuid,nodev,size=32m,uid=472,gid=472
    healthcheck:
      test: [CMD, /usr/bin/wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    pids_limit: 256
    cpus: 0.5
    mem_limit: 512m

volumes:
  alertmanager-data:
  grafana-data:
  loki-data:
  prometheus-data:
  tempo-data:

secrets:
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?GRAFANA_ADMIN_PASSWORD_FILE is required}
