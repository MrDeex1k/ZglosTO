packages:
  - 'frontend'
  - 'backend'
  - 'authorization'
  - 'llm_gateway'
  - 'Mobile'
  - 'packages/*'
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
resolvePeersFromWorkspaceRoot: false
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
overrides:
  '@babel/core': 7.29.7
  '@nestjs/platform-express>multer': 2.2.0
  '@nestjs/swagger>js-yaml': 4.3.1
  'xcode>uuid': 11.1.1
  'xmlbuilder2>js-yaml': 4.3.1
peerDependencyRules:
  allowedVersions:
    '@nestjs/common': 12.0.0-alpha.5
    '@nestjs/core': 12.0.0-alpha.5
    '@nestjs/platform-express': 12.0.0-alpha.5
allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': false
  esbuild: true
  protobufjs: true
