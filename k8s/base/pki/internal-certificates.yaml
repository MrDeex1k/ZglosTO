apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: zglosto-service-selfsigned
  namespace: zglosto
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zglosto-service-ca
  namespace: zglosto
spec:
  isCA: true
  commonName: ZglosTO Service CA
  secretName: zglosto-service-ca-key-pair
  duration: 87600h
  renewBefore: 8760h
  # Root rotation is an explicit maintenance operation. Automatic leaf-key
  # rotation below remains enabled and is handled by the reload controller.
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Never }
  issuerRef: { name: zglosto-service-selfsigned, kind: Issuer }
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: zglosto-service-ca
  namespace: zglosto
spec:
  ca:
    secretName: zglosto-service-ca-key-pair
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: zglosto-database-selfsigned
  namespace: zglosto
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zglosto-database-ca
  namespace: zglosto
spec:
  isCA: true
  commonName: ZglosTO Database CA
  secretName: zglosto-database-ca-key-pair
  duration: 87600h
  renewBefore: 8760h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Never }
  issuerRef: { name: zglosto-database-selfsigned, kind: Issuer }
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: zglosto-database-ca
  namespace: zglosto
spec:
  ca:
    secretName: zglosto-database-ca-key-pair
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: authorization-server, namespace: zglosto }
spec:
  secretName: zglosto-authorization-tls
  duration: 720h
  renewBefore: 168h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  dnsNames: [authorization, authorization.zglosto.svc, authorization.zglosto.svc.cluster.local]
  usages: [server auth]
  issuerRef: { name: zglosto-service-ca, kind: Issuer }
---
