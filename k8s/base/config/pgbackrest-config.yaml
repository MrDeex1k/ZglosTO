apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbackrest-config
  namespace: zglosto
data:
  pgbackrest.conf: |
    [global]
    repo1-path=/var/lib/pgbackrest
    process-max=2
    log-level-console=info
    repo1-retention-full=4
    repo1-retention-diff=14
    start-fast=y
    archive-timeout=60

    [zglosto_db]
    pg1-path=/var/lib/postgresql/18/docker
    pg1-port=54325
