apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: zglosto
  labels:
    app: database
  annotations:
    secret.reloader.stakater.com/reload: zglosto-database-tls,zglosto-database-credentials
spec:
  serviceName: database-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      serviceAccountName: database
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: database
          image: docker.io/zglosto/database:phase9-baseline
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          args:
            - postgres
            - -c
            - port=54325
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/run/postgresql/tls/server.crt
            - -c
            - ssl_key_file=/run/postgresql/tls/server.key
            - -c
            - ssl_min_protocol_version=TLSv1.3
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          ports:
            - name: postgresql
              containerPort: 54325
          env:
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: zglosto-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: zglosto-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: zglosto-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/database-credentials/postgres-password
            - name: DATABASE_DIRECT_URL_FILE
              value: /run/secrets/database-credentials/database-direct-url
            - name: POSTGRES_TLS_CERT_PATH
              value: /run/secrets/database-tls/tls.crt
            - name: POSTGRES_TLS_KEY_PATH
              value: /run/secrets/database-tls/tls.key
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /run/secrets/database-ca/ca.crt
          volumeMounts:
            - name: database-credentials
              mountPath: /run/secrets/database-credentials
              readOnly: true
            - name: database-tls
              mountPath: /run/secrets/database-tls
              readOnly: true
            - name: database-ca
              mountPath: /run/secrets/database-ca
              readOnly: true
            - name: postgres-runtime
              mountPath: /run/postgresql
            - name: postgres-data
              mountPath: /var/lib/postgresql
            - name: pgbackrest-data
              mountPath: /var/lib/pgbackrest
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: '2'
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  PGSSLMODE=require pg_isready -h 127.0.0.1 -p 54325
                  -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  PGSSLMODE=require pg_isready -h 127.0.0.1 -p 54325
                  -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  PGPASSWORD="$(cat /run/secrets/database-credentials/postgres-password)"
                  psql -v ON_ERROR_STOP=1
                  "host=127.0.0.1 port=${POSTGRES_PORT} dbname=${POSTGRES_DB}
                  user=${POSTGRES_USER} sslmode=require"
                  -c "SELECT 1" >/dev/null
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 6
        - name: pgbackrest-scheduler
          image: docker.io/zglosto/database:phase9-baseline
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - /bin/bash
            - -ec
          args:
            - |
              until pg_isready -h 127.0.0.1 -p "${POSTGRES_PORT}" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"; do
                sleep 5
              done
              while true; do
                sleep "${PGBACKREST_BACKUP_INTERVAL_SECONDS}"
                backup_type=diff
                if [ "$(date +%u)" = "7" ]; then
                  backup_type=full
                fi
                gosu postgres pgbackrest \
                  --stanza=zglosto_db \
                  --pg1-port="${POSTGRES_PORT}" \
                  --pg1-user="${POSTGRES_USER}" \
                  --type="${backup_type}" \
                  backup
              done
          env:
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: zglosto-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: zglosto-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: zglosto-config
                  key: POSTGRES_USER
            - name: PGBACKREST_BACKUP_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: zglosto-config
                  key: PGBACKREST_BACKUP_INTERVAL_SECONDS
          volumeMounts:
            - name: postgres-runtime
              mountPath: /run/postgresql
            - name: postgres-data
              mountPath: /var/lib/postgresql
              readOnly: true
            - name: pgbackrest-data
              mountPath: /var/lib/pgbackrest
            - name: pgbackrest-config
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: database-credentials
          secret:
            secretName: zglosto-database-credentials
            optional: false
            defaultMode: 0440
            items:
              - key: POSTGRES_PASSWORD
                path: postgres-password
              - key: DATABASE_DIRECT_URL
                path: database-direct-url
        - name: database-tls
          secret:
            secretName: zglosto-database-tls
            optional: false
            defaultMode: 0440
        - name: database-ca
          secret:
            secretName: zglosto-database-tls
            optional: false
            defaultMode: 0440
            items: [{ key: ca.crt, path: ca.crt }]
        - name: pgbackrest-config
          configMap:
            name: pgbackrest-config
            optional: false
        - name: postgres-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: database
          app.kubernetes.io/component: primary-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: pgbackrest-data
        labels:
          app: database
          app.kubernetes.io/component: backup-repository
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 40Gi
