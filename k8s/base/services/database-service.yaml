apiVersion: v1
kind: Service
metadata:
  name: database-headless
  namespace: zglosto
  labels:
    app: database
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: database
  ports:
    - name: postgresql
      port: 54325
      targetPort: postgresql
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: zglosto
  labels:
    app: database
spec:
  selector:
    app: database
  ports:
    - name: postgresql
      port: 54325
      targetPort: postgresql
      protocol: TCP
  type: ClusterIP
