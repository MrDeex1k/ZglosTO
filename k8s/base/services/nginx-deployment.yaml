apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: zglosto
  labels:
    app: nginx
  annotations:
    secret.reloader.stakater.com/reload: zglosto-nginx-tls
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      serviceAccountName: nginx
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: docker.io/zglosto/nginx:phase9-baseline
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 1235
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: service-ca
              mountPath: /run/secrets/service
              readOnly: true
            - name: nginx-tls
              mountPath: /run/secrets/nginx
              readOnly: true
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: nginx-cache
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: nginx-config
          configMap:
            name: nginx-config
            optional: false
        - name: service-ca
          secret:
            secretName: zglosto-nginx-tls
            optional: false
            defaultMode: 0440
            items: [{ key: ca.crt, path: ca.crt }]
        - name: nginx-tls
          secret:
            secretName: zglosto-nginx-tls
            optional: false
            defaultMode: 0440
