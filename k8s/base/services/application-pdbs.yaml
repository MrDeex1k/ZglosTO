apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: authorization-pdb, namespace: zglosto }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: authorization } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: frontend-pdb, namespace: zglosto }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: frontend } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: nginx-pdb, namespace: zglosto }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: nginx } }
