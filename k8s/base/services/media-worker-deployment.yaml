apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-worker
  namespace: zglosto
  labels:
    app: media-worker
  annotations:
    secret.reloader.stakater.com/reload: zglosto-pgbouncer-tls,zglosto-rabbitmq-tls,zglosto-database-credentials,zglosto-rabbitmq-credentials,zglosto-object-storage-credentials
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: media-worker
  template:
    metadata:
      labels:
        app: media-worker
    spec:
      serviceAccountName: media-worker
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-worker
          image: docker.io/zglosto/backend:phase9-baseline
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args: [node, --import, '@zglosto/observability/register', dist/nest/media-worker/main.js]
          env:
            - { name: OBSERVABILITY_MODE, value: disabled }
            - { name: OTEL_SERVICE_NAME, value: media_worker }
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: NODE_ENV } }
            - name: SERVICE_NAME
              value: media_worker
            - name: DATABASE_URL_FILE
              value: /run/secrets/database-credentials/database-url
            - name: DATABASE_TLS_CA_PATH
              value: /run/secrets/database/ca.crt
            - name: DATABASE_POOL_MAX
              valueFrom:
                { configMapKeyRef: { name: zglosto-config, key: MEDIA_WORKER_DATABASE_POOL_MAX } }
            - name: DATABASE_IDLE_TIMEOUT_MS
              valueFrom:
                { configMapKeyRef: { name: zglosto-config, key: DATABASE_IDLE_TIMEOUT_MS } }
            - name: DATABASE_CONNECTION_TIMEOUT_MS
              valueFrom:
                { configMapKeyRef: { name: zglosto-config, key: DATABASE_CONNECTION_TIMEOUT_MS } }
            - name: RABBITMQ_URL_FILE
              value: /run/secrets/rabbitmq-credentials/rabbitmq-url
            - name: RABBITMQ_TLS_CA_PATH
              value: /run/secrets/service/ca.crt
            - name: RABBITMQ_SERVER_NAME
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: RABBITMQ_SERVER_NAME } }
            - name: RABBITMQ_HEARTBEAT_SECONDS
              valueFrom:
                { configMapKeyRef: { name: zglosto-config, key: RABBITMQ_HEARTBEAT_SECONDS } }
            - name: RABBITMQ_RECONNECT_DELAY_MS
              valueFrom:
                { configMapKeyRef: { name: zglosto-config, key: RABBITMQ_RECONNECT_DELAY_MS } }
            - name: RABBITMQ_PUBLISHER_ENABLED
              value: 'false'
            - name: MEDIA_WORKER_HEALTH_FILE
              valueFrom:
                { configMapKeyRef: { name: zglosto-config, key: MEDIA_WORKER_HEALTH_FILE } }
            - name: MEDIA_WORKER_HEALTH_INTERVAL_MS
              valueFrom:
                { configMapKeyRef: { name: zglosto-config, key: MEDIA_WORKER_HEALTH_INTERVAL_MS } }
            - name: MEDIA_WORKER_HEALTH_STALE_MS
              valueFrom:
                { configMapKeyRef: { name: zglosto-config, key: MEDIA_WORKER_HEALTH_STALE_MS } }
            - name: MEDIA_WORKER_PREFETCH
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: MEDIA_WORKER_PREFETCH } }
            - name: KEDA_RABBITMQ_TLS
              value: enable
            - name: MEDIA_MAX_INPUT_BYTES
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: MEDIA_MAX_INPUT_BYTES } }
            - name: MEDIA_MAX_INPUT_WIDTH
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: MEDIA_MAX_INPUT_WIDTH } }
            - name: MEDIA_MAX_INPUT_HEIGHT
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: MEDIA_MAX_INPUT_HEIGHT } }
            - name: MEDIA_MAX_INPUT_PIXELS
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: MEDIA_MAX_INPUT_PIXELS } }
            - name: MEDIA_MAX_OUTPUT_DIMENSION
              valueFrom:
                { configMapKeyRef: { name: zglosto-config, key: MEDIA_MAX_OUTPUT_DIMENSION } }
            - name: MEDIA_SHARP_CONCURRENCY
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: MEDIA_SHARP_CONCURRENCY } }
            - name: MEDIA_WEBP_QUALITY
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: MEDIA_WEBP_QUALITY } }
            - name: MEDIA_WEBP_EFFORT
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: MEDIA_WEBP_EFFORT } }
            - name: S3_ENDPOINT
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: S3_ENDPOINT } }
            - name: S3_REGION
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: S3_REGION } }
            - name: S3_BUCKET
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: S3_BUCKET } }
            - name: S3_ACCESS_KEY_ID_FILE
              value: /run/secrets/object-storage-credentials/access-key-id
            - name: S3_SECRET_ACCESS_KEY_FILE
              value: /run/secrets/object-storage-credentials/secret-access-key
            - name: S3_FORCE_PATH_STYLE
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: S3_FORCE_PATH_STYLE } }
            - name: S3_OBJECT_PREFIX
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: S3_OBJECT_PREFIX } }
            - name: S3_AUTO_CREATE_BUCKET
              valueFrom: { configMapKeyRef: { name: zglosto-config, key: S3_AUTO_CREATE_BUCKET } }
          volumeMounts:
            - {
                name: database-credentials,
                mountPath: /run/secrets/database-credentials,
                readOnly: true,
              }
            - {
                name: rabbitmq-credentials,
                mountPath: /run/secrets/rabbitmq-credentials,
                readOnly: true,
              }
            - {
                name: object-storage-credentials,
                mountPath: /run/secrets/object-storage-credentials,
                readOnly: true,
              }
            - { name: database-ca, mountPath: /run/secrets/database, readOnly: true }
            - { name: service-ca, mountPath: /run/secrets/service, readOnly: true }
            - { name: health, mountPath: /tmp }
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 512Mi, cpu: 500m }
          startupProbe: &mediaProbe
            exec: { command: [node, dist/nest/media-worker/healthcheck.js] }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            <<: *mediaProbe
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            <<: *mediaProbe
            failureThreshold: 6
      volumes:
        - name: database-credentials
          secret:
            secretName: zglosto-database-credentials
            optional: false
            defaultMode: 0440
            items: [{ key: DATABASE_URL, path: database-url }]
        - name: rabbitmq-credentials
          secret:
            secretName: zglosto-rabbitmq-credentials
            optional: false
            defaultMode: 0440
            items: [{ key: RABBITMQ_URL, path: rabbitmq-url }]
        - name: object-storage-credentials
          secret:
            secretName: zglosto-object-storage-credentials
            optional: false
            defaultMode: 0440
            items:
              - key: S3_ACCESS_KEY_ID
                path: access-key-id
              - key: S3_SECRET_ACCESS_KEY
                path: secret-access-key
        - name: database-ca
          secret:
            secretName: zglosto-pgbouncer-tls
            optional: false
            defaultMode: 0440
            items: [{ key: ca.crt, path: ca.crt }]
        - name: service-ca
          secret:
            secretName: zglosto-rabbitmq-tls
            optional: false
            defaultMode: 0440
            items: [{ key: ca.crt, path: ca.crt }]
        - name: health
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
