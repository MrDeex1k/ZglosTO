apiVersion: v1
kind: ServiceAccount
metadata: { name: otel-collector, namespace: zglosto }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-external-config, namespace: zglosto }
data:
  config.yaml: |
    extensions:
      health_check: {endpoint: 0.0.0.0:13133}
      headers_setter/external:
        headers:
          - action: upsert
            key: ${env:OTEL_EXTERNAL_AUTH_HEADER_NAME}
            value_file: /run/secrets/otel-external/authorization
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter: {check_interval: 1s, limit_percentage: 75, spike_limit_percentage: 15}
      attributes/redact:
        actions:
          - {key: enduser.id, action: delete}
          - {key: user.id, action: delete}
          - {key: user.email, action: delete}
          - {key: http.request.header.cookie, action: delete}
          - {key: http.request.header.authorization, action: delete}
          - {key: db.statement, action: delete}
          - {key: messaging.message.body, action: delete}
          - {key: gen_ai.prompt, action: delete}
          - {key: gen_ai.completion, action: delete}
      batch: {send_batch_size: 512, timeout: 2s}
    exporters:
      otlphttp/external:
        endpoint: ${env:OTEL_EXTERNAL_ENDPOINT}
        auth: {authenticator: headers_setter/external}
        compression: gzip
        sending_queue: {enabled: true, queue_size: 2048}
        retry_on_failure: {enabled: true, max_elapsed_time: 300s}
    service:
      extensions: [health_check, headers_setter/external]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [otlphttp/external]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [otlphttp/external]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [otlphttp/external]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: zglosto }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      serviceAccountName: otel-collector
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.159.0
          args: [--config=/etc/otelcol-contrib/config.yaml]
          env:
            - { name: OTEL_EXTERNAL_AUTH_HEADER_NAME, value: Authorization }
            - name: OTEL_EXTERNAL_ENDPOINT
              valueFrom:
                configMapKeyRef: { name: zglosto-observability-external, key: endpoint }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: health, containerPort: 13133 }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol-contrib, readOnly: true }
            - { name: external-auth, mountPath: /run/secrets/otel-external, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: health }
          livenessProbe:
            httpGet: { path: /, port: health }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: config
          configMap: { name: otel-collector-external-config }
        - name: external-auth
          secret:
            secretName: zglosto-otel-external
            optional: false
            defaultMode: 0440
            items: [{ key: AUTHORIZATION, path: authorization }]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: zglosto }
spec:
  type: ClusterIP
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-observability-external, namespace: zglosto }
spec:
  podSelector: { matchLabels: { app: otel-collector } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - { podSelector: { matchLabels: { app: authorization } } }
        - { podSelector: { matchLabels: { app: backend } } }
        - { podSelector: { matchLabels: { app: media-worker } } }
        - { podSelector: { matchLabels: { app: llm-gateway } } }
      ports: [{ protocol: TCP, port: 4318 }]
  egress:
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports: [{ protocol: TCP, port: 443 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apps-to-otel-collector, namespace: zglosto }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [authorization, backend, media-worker, llm-gateway] }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: otel-collector } } }]
      ports: [{ protocol: TCP, port: 4318 }]
