apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - serviceaccount.yaml
  - service.yaml
  - statefulset.yaml
  - network-policies.yaml

patches:
  - path: authorization-redis-patch.yaml
    target:
      kind: Deployment
      name: authorization
  - path: backend-redis-patch.yaml
    target:
      kind: Deployment
      name: backend
