apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - serviceaccount.yaml
  - statefulset.yaml
  - service.yaml
  - provision-job.yaml
  - provision-network-policy.yaml

configMapGenerator:
  - name: zglosto-config
    namespace: zglosto
    behavior: merge
    options: { immutable: true }
    literals:
      - S3_ENDPOINT=http://rustfs:9000
      - S3_FORCE_PATH_STYLE=true
      - S3_AUTO_CREATE_BUCKET=false
  - name: storage-iam-provision-script
    namespace: zglosto
    options: { immutable: true }
    files:
      - provision-storage-iam.sh
