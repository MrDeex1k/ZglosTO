apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: zglosto
  labels:
    app: rustfs
  annotations:
    secret.reloader.stakater.com/reload: zglosto-object-storage-credentials
spec:
  serviceName: rustfs-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      serviceAccountName: rustfs
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-rc.5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - /bin/sh
            - -ec
          args:
            - |
              export RUSTFS_ACCESS_KEY="$(cat /run/secrets/object-storage/access-key-id)"
              export RUSTFS_SECRET_KEY="$(cat /run/secrets/object-storage/secret-access-key)"
              exec /entrypoint.sh rustfs
          env:
            - name: RUSTFS_CONSOLE_ENABLE
              value: 'false'
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: ''
          ports:
            - name: s3
              containerPort: 9000
          volumeMounts:
            - name: rustfs-data
              mountPath: /data
            - name: object-storage-credentials
              mountPath: /run/secrets/object-storage
              readOnly: true
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: '2'
          startupProbe:
            httpGet:
              path: /health/ready
              port: s3
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: s3
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: object-storage-credentials
          secret:
            secretName: zglosto-object-storage-credentials
            optional: false
            defaultMode: 0440
            items:
              - key: S3_ACCESS_KEY_ID
                path: access-key-id
              - key: S3_SECRET_ACCESS_KEY
                path: secret-access-key
  volumeClaimTemplates:
    - metadata:
        name: rustfs-data
        labels:
          app: rustfs
          app.kubernetes.io/component: object-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
