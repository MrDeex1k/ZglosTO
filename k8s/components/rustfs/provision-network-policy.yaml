apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-storage-provision-egress, namespace: zglosto }
spec:
  podSelector: { matchLabels: { app: storage-provision } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: rustfs } } }]
      ports: [{ protocol: TCP, port: 9000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-storage-provision-ingress, namespace: zglosto }
spec:
  podSelector: { matchLabels: { app: rustfs } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: storage-provision } } }]
      ports: [{ protocol: TCP, port: 9000 }]
