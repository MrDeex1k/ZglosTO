apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - resources.yaml

patches:
  - target:
      kind: Deployment
      name: authorization|backend|media-worker|llm-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: local
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OTEL_DEPLOYMENT_ENVIRONMENT, value: "production"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OTEL_SERVICE_VERSION, value: "phase9"}
