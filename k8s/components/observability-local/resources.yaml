apiVersion: v1
kind: ServiceAccount
metadata: { name: observability, namespace: zglosto }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: observability-config, namespace: zglosto }
data:
  otel.yaml: |
    extensions:
      health_check: {endpoint: 0.0.0.0:13133}
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors:
      memory_limiter: {check_interval: 1s, limit_percentage: 75, spike_limit_percentage: 15}
      attributes/redact:
        actions:
          - {key: enduser.id, action: delete}
          - {key: user.id, action: delete}
          - {key: user.email, action: delete}
          - {key: http.request.header.cookie, action: delete}
          - {key: http.request.header.authorization, action: delete}
          - {key: db.statement, action: delete}
          - {key: messaging.message.body, action: delete}
          - {key: gen_ai.prompt, action: delete}
          - {key: gen_ai.completion, action: delete}
      batch: {send_batch_size: 512, timeout: 2s}
    exporters:
      prometheus:
        endpoint: 0.0.0.0:9464
        enable_open_metrics: true
        resource_to_telemetry_conversion: {enabled: true}
      otlp/tempo:
        endpoint: tempo:4317
        tls: {insecure: true}
      otlphttp/loki:
        endpoint: http://loki:3100/otlp
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus: {host: 0.0.0.0, port: 8888}
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [otlphttp/loki]
  prometheus.yaml: |
    global: {scrape_interval: 15s, evaluation_interval: 15s}
    rule_files: [/etc/prometheus/rules.yaml]
    alerting:
      alertmanagers:
        - static_configs:
            - targets: [alertmanager:9093]
    scrape_configs:
      - job_name: zglosto-application
        static_configs:
          - targets: [otel-collector:9464]
      - job_name: zglosto-collector
        static_configs:
          - targets: [otel-collector:8888]
      - job_name: zglosto-rabbitmq
        static_configs:
          - targets: [rabbitmq:15692]
  rules.yaml: |
    groups:
      - name: zglosto-foundation
        rules:
          - alert: ZglostoHighHttpErrorRate
            expr: (sum(rate(zglosto_http_server_requests_total{http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate(zglosto_http_server_requests_total[5m])), 0.001)) > 0.05
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "ZglosTO HTTP 5xx rate exceeds 5%"}
          - alert: ZglostoRedisUnavailable
            expr: min by (service_name, redis_mode) (zglosto_redis_dependency_up{redis_mode=~"local|external"}) == 0
            for: 2m
            labels: {severity: warning}
            annotations: {summary: "ZglosTO Redis is unavailable and fallback paths are active"}
          - alert: ZglostoRedisOperationErrors
            expr: sum by (service_name, redis_mode) (rate(zglosto_redis_operations_total{outcome="error"}[5m])) > 0
            for: 5m
            labels: {severity: warning}
            annotations: {summary: "ZglosTO Redis operations keep failing"}
          - alert: ZglostoRedisHighLatency
            expr: histogram_quantile(0.95, sum by (le, service_name, redis_mode) (rate(zglosto_redis_operation_duration_seconds_bucket{outcome="success"}[5m]))) > 0.25
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "ZglosTO Redis p95 operation latency exceeds 250 ms"}
  loki.yaml: |
    auth_enabled: false
    server: {http_listen_port: 3100}
    common:
      path_prefix: /loki
      replication_factor: 1
      ring: {instance_addr: 127.0.0.1, kvstore: {store: inmemory}}
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    storage_config: {filesystem: {directory: /loki/chunks}}
    limits_config: {retention_period: 168h, allow_structured_metadata: true}
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
  tempo.yaml: |
    server: {http_listen_port: 3200}
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: {endpoint: 0.0.0.0:4317}
            http: {endpoint: 0.0.0.0:4318}
    storage:
      trace:
        backend: local
        local: {path: /var/tempo/traces}
        wal: {path: /var/tempo/wal}
    compactor: {compaction: {block_retention: 168h}}
  alertmanager.yaml: |
    route:
      receiver: local-null
      group_by: [alertname, service_name]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: local-null
  grafana-datasources.yaml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, type: prometheus, uid: prometheus, access: proxy, url: "http://prometheus:9090", isDefault: true}
      - {name: Loki, type: loki, uid: loki, access: proxy, url: "http://loki:3100"}
      - {name: Tempo, type: tempo, uid: tempo, access: proxy, url: "http://tempo:3200"}
  grafana-dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: ZglosTO
        folder: ZglosTO
        type: file
        disableDeletion: true
        options: {path: /var/lib/grafana/dashboards}
  zglosto-overview.json: |
    {
      "editable": true,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "sum by (service_name) (rate(zglosto_http_server_requests_total[5m]))", "legendFormat": "{{service_name}}"}],
          "title": "HTTP request rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [{"expr": "zglosto_redis_dependency_up{redis_mode=~\"local|external\"}", "legendFormat": "{{service_name}} / {{redis_mode}}"}],
          "title": "Redis dependency state",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "id": 3,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, service_name, redis_mode) (rate(zglosto_redis_operation_duration_seconds_bucket[5m])))", "legendFormat": "{{service_name}} / {{redis_mode}}"}],
          "title": "Redis p95 duration",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 42,
      "tags": ["zglosto", "foundation"],
      "title": "ZglosTO overview",
      "uid": "zglosto-overview",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: zglosto }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      serviceAccountName: observability
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.159.0
          args: [--config=/etc/otel/config.yaml]
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: metrics, containerPort: 9464 }
            - { name: self-metrics, containerPort: 8888 }
            - { name: health, containerPort: 13133 }
          volumeMounts:
            - { name: config, mountPath: /etc/otel/config.yaml, subPath: otel.yaml, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /, port: health } }
          livenessProbe: { httpGet: { path: /, port: health } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: config, configMap: { name: observability-config } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: zglosto }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: observability
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          args:
            [
              --config.file=/etc/prometheus/prometheus.yaml,
              --storage.tsdb.path=/prometheus,
              --storage.tsdb.retention.time=15d,
            ]
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts:
            - {
                name: config,
                mountPath: /etc/prometheus/prometheus.yaml,
                subPath: prometheus.yaml,
                readOnly: true,
              }
            - {
                name: config,
                mountPath: /etc/prometheus/rules.yaml,
                subPath: rules.yaml,
                readOnly: true,
              }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
          readinessProbe: { httpGet: { path: /-/ready, port: http } }
          livenessProbe: { httpGet: { path: /-/healthy, port: http } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: config, configMap: { name: observability-config } }
        - { name: data, persistentVolumeClaim: { claimName: prometheus-data } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loki, namespace: zglosto }
spec:
  replicas: 1
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      serviceAccountName: observability
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: grafana/loki:3.7.7
          args: [-config.file=/etc/loki/config.yaml]
          ports: [{ name: http, containerPort: 3100 }]
          volumeMounts:
            - { name: config, mountPath: /etc/loki/config.yaml, subPath: loki.yaml, readOnly: true }
            - { name: data, mountPath: /loki }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
          readinessProbe: { httpGet: { path: /ready, port: http } }
          livenessProbe: { httpGet: { path: /ready, port: http } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: config, configMap: { name: observability-config } }
        - { name: data, persistentVolumeClaim: { claimName: loki-data } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tempo, namespace: zglosto }
spec:
  replicas: 1
  selector: { matchLabels: { app: tempo } }
  template:
    metadata: { labels: { app: tempo } }
    spec:
      serviceAccountName: observability
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: grafana/tempo:3.0.3
          args: [-config.file=/etc/tempo/config.yaml]
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
          volumeMounts:
            - {
                name: config,
                mountPath: /etc/tempo/config.yaml,
                subPath: tempo.yaml,
                readOnly: true,
              }
            - { name: data, mountPath: /var/tempo }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
          readinessProbe: { httpGet: { path: /ready, port: http } }
          livenessProbe: { httpGet: { path: /ready, port: http } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: config, configMap: { name: observability-config } }
        - { name: data, persistentVolumeClaim: { claimName: tempo-data } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alertmanager, namespace: zglosto }
spec:
  replicas: 1
  selector: { matchLabels: { app: alertmanager } }
  template:
    metadata: { labels: { app: alertmanager } }
    spec:
      serviceAccountName: observability
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.34.0
          args: [--config.file=/etc/alertmanager/config.yaml, --storage.path=/alertmanager]
          ports: [{ name: http, containerPort: 9093 }]
          volumeMounts:
            - {
                name: config,
                mountPath: /etc/alertmanager/config.yaml,
                subPath: alertmanager.yaml,
                readOnly: true,
              }
            - { name: data, mountPath: /alertmanager }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /-/ready, port: http } }
          livenessProbe: { httpGet: { path: /-/healthy, port: http } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: config, configMap: { name: observability-config } }
        - { name: data, persistentVolumeClaim: { claimName: alertmanager-data } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: zglosto }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      serviceAccountName: observability
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:13.2.1
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: 'false' }
            - { name: GF_SECURITY_ADMIN_PASSWORD__FILE, value: /run/secrets/grafana/admin-password }
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
          ports: [{ name: http, containerPort: 3000 }]
          volumeMounts:
            - {
                name: config,
                mountPath: /etc/grafana/provisioning/datasources/datasources.yaml,
                subPath: grafana-datasources.yaml,
                readOnly: true,
              }
            - {
                name: config,
                mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml,
                subPath: grafana-dashboards.yaml,
                readOnly: true,
              }
            - {
                name: config,
                mountPath: /var/lib/grafana/dashboards/zglosto-overview.json,
                subPath: zglosto-overview.json,
                readOnly: true,
              }
            - { name: admin, mountPath: /run/secrets/grafana, readOnly: true }
            - { name: data, mountPath: /var/lib/grafana }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /api/health, port: http } }
          livenessProbe: { httpGet: { path: /api/health, port: http } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - { name: config, configMap: { name: observability-config } }
        - name: admin
          secret:
            secretName: zglosto-grafana-admin
            optional: false
            defaultMode: 0440
            items: [{ key: ADMIN_PASSWORD, path: admin-password }]
        - { name: data, persistentVolumeClaim: { claimName: grafana-data } }
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: zglosto }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: metrics, port: 9464, targetPort: metrics }
    - { name: self-metrics, port: 8888, targetPort: self-metrics }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: zglosto }
spec: { selector: { app: prometheus }, ports: [{ name: http, port: 9090, targetPort: http }] }
---
apiVersion: v1
kind: Service
metadata: { name: loki, namespace: zglosto }
spec: { selector: { app: loki }, ports: [{ name: http, port: 3100, targetPort: http }] }
---
apiVersion: v1
kind: Service
metadata: { name: tempo, namespace: zglosto }
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
---
apiVersion: v1
kind: Service
metadata: { name: alertmanager, namespace: zglosto }
spec: { selector: { app: alertmanager }, ports: [{ name: http, port: 9093, targetPort: http }] }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: zglosto }
spec:
  {
    type: ClusterIP,
    selector: { app: grafana },
    ports: [{ name: http, port: 3000, targetPort: http }],
  }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: prometheus-data, namespace: zglosto }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: loki-data, namespace: zglosto }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: tempo-data, namespace: zglosto }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: alertmanager-data, namespace: zglosto }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: grafana-data, namespace: zglosto }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-apps-to-local-observability, namespace: zglosto }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [authorization, backend, media-worker, llm-gateway] }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: otel-collector } } }]
      ports: [{ protocol: TCP, port: 4318 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-local-observability, namespace: zglosto }
spec:
  podSelector:
    matchExpressions:
      - {
          key: app,
          operator: In,
          values: [otel-collector, prometheus, loki, tempo, alertmanager, grafana],
        }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - { podSelector: { matchLabels: { app: authorization } } }
        - { podSelector: { matchLabels: { app: backend } } }
        - { podSelector: { matchLabels: { app: media-worker } } }
        - { podSelector: { matchLabels: { app: llm-gateway } } }
        - podSelector:
            matchExpressions:
              - {
                  key: app,
                  operator: In,
                  values: [otel-collector, prometheus, loki, tempo, alertmanager, grafana],
                }
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
        - { protocol: TCP, port: 8888 }
        - { protocol: TCP, port: 9464 }
        - { protocol: TCP, port: 9090 }
        - { protocol: TCP, port: 9093 }
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 3100 }
        - { protocol: TCP, port: 3200 }
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - {
                  key: app,
                  operator: In,
                  values:
                    [otel-collector, prometheus, loki, tempo, alertmanager, grafana, rabbitmq],
                }
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 8888 }
        - { protocol: TCP, port: 9464 }
        - { protocol: TCP, port: 9090 }
        - { protocol: TCP, port: 9093 }
        - { protocol: TCP, port: 3100 }
        - { protocol: TCP, port: 3200 }
        - { protocol: TCP, port: 15692 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-prometheus-to-rabbitmq-metrics, namespace: zglosto }
spec:
  podSelector: { matchLabels: { app: rabbitmq } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: prometheus } } }]
      ports: [{ protocol: TCP, port: 15692 }]
