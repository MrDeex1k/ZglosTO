apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization
  annotations:
    secret.reloader.stakater.com/reload: zglosto-authorization-tls,zglosto-authorization-healthcheck-tls,zglosto-pgbouncer-tls,zglosto-database-credentials,zglosto-better-auth,zglosto-redis-credentials,zglosto-redis-external-ca
spec:
  template:
    spec:
      containers:
        - name: authorization
          env:
            - { name: REDIS_MODE, value: external }
            - { name: REDIS_URL_FILE, value: /run/secrets/redis/url }
            - { name: REDIS_TLS_CA_PATH, value: /run/secrets/redis-ca/ca.crt }
            - { name: RATE_LIMIT_HMAC_KEY_FILE, value: /run/secrets/redis/rate-limit-hmac }
          volumeMounts:
            - name: redis-credentials
              mountPath: /run/secrets/redis
              readOnly: true
            - name: redis-external-ca
              mountPath: /run/secrets/redis-ca
              readOnly: true
      volumes:
        - name: redis-credentials
          secret:
            secretName: zglosto-redis-credentials
            optional: false
            defaultMode: 0440
            items:
              - key: REDIS_URL
                path: url
              - key: RATE_LIMIT_HMAC_KEY
                path: rate-limit-hmac
        - name: redis-external-ca
          secret:
            secretName: zglosto-redis-external-ca
            optional: false
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
