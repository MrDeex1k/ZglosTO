apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../k3s

components:
  - ../../components/rustfs
  - ../../components/observability-external

patches:
  - target: { kind: StatefulSet, name: rustfs }
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: local-path

configMapGenerator:
  - name: zglosto-observability-external
    namespace: zglosto
    literals:
      - endpoint=https://otel.example.invalid

sortOptions:
  order: legacy
  legacySortOptions:
    orderLast:
      - TriggerAuthentication
      - InterceptorRoute
      - ScaledObject
