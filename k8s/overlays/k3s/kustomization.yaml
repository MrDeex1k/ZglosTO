apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: ingress.yaml
  - path: storage-class.yaml
    target:
      kind: StatefulSet
      name: database
  - path: rabbitmq-storage-class.yaml
    target:
      kind: StatefulSet
      name: rabbitmq
  - path: ingress-network-policy.yaml
    target:
      kind: NetworkPolicy
      name: allow-ingress-to-nginx

labels:
  - pairs:
      app.kubernetes.io/platform: k3s
    includeSelectors: false
    includeTemplates: true

sortOptions:
  order: legacy
  legacySortOptions:
    orderLast:
      - TriggerAuthentication
      - InterceptorRoute
      - ScaledObject
