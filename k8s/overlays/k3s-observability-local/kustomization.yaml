apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../k3s

components:
  - ../../components/observability-local

patches:
  - target: { kind: PersistentVolumeClaim }
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: local-path

sortOptions:
  order: legacy
  legacySortOptions:
    orderLast:
      - TriggerAuthentication
      - InterceptorRoute
      - ScaledObject
