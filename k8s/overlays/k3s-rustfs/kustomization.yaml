apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../k3s

components:
  - ../../components/rustfs

patches:
  - path: storage-class.yaml
    target:
      kind: StatefulSet
      name: rustfs

sortOptions:
  order: legacy
  legacySortOptions:
    orderLast:
      - TriggerAuthentication
      - InterceptorRoute
      - ScaledObject
