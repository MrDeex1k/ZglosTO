services:
  backend:
    environment:
      SERVICE_NAME: storage_operations
      S3_ACCESS_KEY_ID: !reset null
      S3_SECRET_ACCESS_KEY: !reset null
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_operations_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_operations_secret_access_key
      S3_AUTO_CREATE_BUCKET: 'false'
    secrets:
      - s3_operations_access_key_id
      - s3_operations_secret_access_key
secrets:
  s3_operations_access_key_id:
    file: ${S3_OPERATIONS_ACCESS_KEY_ID_FILE:-${ZTO_SECRETS_DIR:-./secrets/production}/s3-operations-access-key-id}
  s3_operations_secret_access_key:
    file: ${S3_OPERATIONS_SECRET_ACCESS_KEY_FILE:-${ZTO_SECRETS_DIR:-./secrets/production}/s3-operations-secret-access-key}
