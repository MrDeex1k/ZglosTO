services:
  database:
    container_name: '${SMOKE_PROJECT_NAME:-zglosto-smoke}-postgres'
    ports: !override
      - '127.0.0.1:${SMOKE_DATABASE_PORT:-15432}:${POSTGRES_PORT}'
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql
      - type: tmpfs
        target: /var/lib/pgbackrest

  nginx:
    ports: !override
      - '127.0.0.1:${SMOKE_HTTP_PORT:-11235}:1235'
