appId: pl.zglosto.app
---
- launchApp:
    clearState: true
- openLink:
    link: ${EXPO_DEV_CLIENT_URL}
- runFlow:
    when:
      visible: '.*(Open|Otwórz).*'
    commands:
      - tapOn: '.*(Open|Otwórz).*'
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn: 'Close'
- runFlow: phase5-performance-login.yaml
