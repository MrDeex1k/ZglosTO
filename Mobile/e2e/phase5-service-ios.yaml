appId: pl.zglosto.app
name: Phase 5 service queue — iOS setup
tags:
  - phase5
  - service
  - ios
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: ${EXPO_DEV_CLIENT_URL}
- runFlow:
    when:
      visible: '.*(Open|Otwórz).*'
    commands:
      - tapOn: '.*(Open|Otwórz).*'
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn: 'Close'
- runFlow: phase5-service-journey.yaml
