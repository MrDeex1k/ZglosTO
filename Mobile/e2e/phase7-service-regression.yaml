appId: pl.zglosto.app
name: Phase 7 repository regression — service boundary
tags:
  - phase7
  - repository-ready
  - service
---
- launchApp:
    clearState: true
- openLink:
    link: ${EXPO_DEV_CLIENT_URL}
- runFlow:
    when:
      visible: 'Development Build'
    commands:
      - openLink:
          link: ${EXPO_DEV_CLIENT_URL}
- runFlow:
    when:
      visible: '.*(Open|Otwórz).*'
    commands:
      - tapOn: '.*(Open|Otwórz).*'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn: 'Close'
- runFlow: phase7-normalize-session.yaml
- runFlow:
    when:
      visible: 'Polski'
    commands:
      - tapOn: 'Polski'
- extendedWaitUntil:
    visible: '.*Uszkodzony znak przy przejściu dla pieszych został wymieniony.*'
    timeout: 30000
- tapOn: 'Zaloguj się'
- tapOn:
    id: 'login-email'
- inputText: ${PHASE7_SERVICE_EMAIL}
- tapOn:
    id: 'login-password'
- inputText: ${PHASE7_SERVICE_PASSWORD}
- tapOn:
    id: 'login-submit'
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: '.*(Zachować hasło|Save Password).*'
          commands:
            - tapOn: '.*(Nie teraz|Not Now).*'
- extendedWaitUntil:
    visible: 'Panel służby — Zarząd Dróg Miejskich'
    timeout: 30000
- assertVisible: 'Panel służby — Zarząd Dróg Miejskich'
- assertVisible: 'Zarząd Dróg'
- scrollUntilVisible:
    element:
      text: '.*Zwężenie jezdni utrudnia przejazd autobusom komunikacji miejskiej.*'
    direction: DOWN
    timeout: 30000
- assertVisible: '.*Zwężenie jezdni utrudnia przejazd autobusom komunikacji miejskiej.*'
- assertNotVisible: 'Zobacz ostatnio rozwiązane zgłoszenia w mieście.'
- openLink:
    link: 'zglosto://open/incidents/00000000-0000-4000-8000-000000000076?target=public'
- extendedWaitUntil:
    visible: 'Panel służby — Zarząd Dróg Miejskich'
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Wyloguj się'
    direction: DOWN
    timeout: 30000
- tapOn: 'Wyloguj się'
- extendedWaitUntil:
    visible: '.*Uszkodzony znak przy przejściu dla pieszych został wymieniony.*'
    timeout: 30000
