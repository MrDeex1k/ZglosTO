# Optional Docker Model Runner profile. The base Compose stack keeps LLM_RUNTIME=disabled.
services:
  llm_gateway:
    environment:
      LLM_RUNTIME: docker-model-runner
      LLM_UPSTREAM_TIMEOUT_MS: '5000'
    models:
      basal:
        endpoint_var: DOCKER_MODEL_RUNNER_URL
        model_var: DOCKER_MODEL_RUNNER_MODEL

models:
  basal:
    model: zglosto/basal-2.0-mini:q5_k_m
    context_size: 4096
