x-production-defaults: &production-defaults
  restart: always
  init: true
  pull_policy: never
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: '5'
  stop_grace_period: 30s

x-node-hardening: &node-hardening
  <<: *production-defaults
  read_only: true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m

services:
  database:
    <<: *production-defaults
    image: ${DATABASE_IMAGE:?DATABASE_IMAGE must come from the verified production build}
    build: !reset null
    container_name: !reset null
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_DIRECT_URL: !reset null
      DATABASE_DIRECT_URL_FILE: /run/secrets/database_direct_url
      PGSSLROOTCERT: /run/secrets/database_ca
      POSTGRES_TLS_CERT_PATH: /run/secrets/postgres_server_cert
      POSTGRES_TLS_KEY_PATH: /run/secrets/postgres_server_key
    volumes: !override
      - postgres-data:/var/lib/postgresql
      - pgbackrest-data:/var/lib/pgbackrest
    secrets:
      - database_ca
      - database_direct_url
      - postgres_password
      - postgres_server_cert
      - postgres_server_key
    tmpfs:
      - /run:rw,nosuid,nodev,size=32m
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 256
    cpus: 2
    mem_limit: 2g

  pgbouncer:
    <<: *production-defaults
    image: ${PGBOUNCER_IMAGE:?PGBOUNCER_IMAGE must come from the verified production build}
    build: !reset null
    environment:
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_direct_url
      PGBOUNCER_CLIENT_URL: !reset null
      PGBOUNCER_CLIENT_URL_FILE: /run/secrets/database_url
      DATABASE_TLS_CA_SOURCE_PATH: /run/secrets/database_ca
      PGBOUNCER_TLS_CERT_PATH: /run/secrets/pgbouncer_server_cert
      PGBOUNCER_TLS_KEY_PATH: /run/secrets/pgbouncer_server_key
    volumes: !reset []
    secrets:
      - database_ca
      - database_direct_url
      - database_url
      - pgbouncer_server_cert
      - pgbouncer_server_key
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /etc/pgbouncer:rw,noexec,nosuid,nodev,size=8m,uid=70,gid=70,mode=0700
      - /var/run/pgbouncer:rw,noexec,nosuid,nodev,size=8m,uid=70,gid=70,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=70,gid=70,mode=1777
    pids_limit: 128
    cpus: 0.5
    mem_limit: 256m

  rabbitmq:
    <<: *production-defaults
    image: ${RABBITMQ_IMAGE:?RABBITMQ_IMAGE must come from the verified production build}
    build: !reset null
    environment:
      RABBITMQ_DEFAULT_USER: !reset null
      RABBITMQ_DEFAULT_PASS: !reset null
      RABBITMQ_USER_FILE: !reset null
      RABBITMQ_PASSWORD_FILE: !reset null
      RABBITMQ_DEFAULT_USER_FILE: /run/secrets/rabbitmq_user
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    volumes: !override
      - rabbitmq-data:/var/lib/rabbitmq
    configs:
      - source: rabbitmq_production_config
        target: /etc/rabbitmq/rabbitmq.conf
        mode: 0444
    secrets:
      - rabbitmq_password
      - rabbitmq_server_cert
      - rabbitmq_server_key
      - rabbitmq_user
      - service_ca
    pids_limit: 512
    cpus: 1
    mem_limit: 1g

  authorization:
    <<: *node-hardening
    image: ${AUTHORIZATION_IMAGE:?AUTHORIZATION_IMAGE must come from the verified production build}
    build: !reset null
    environment:
      NODE_ENV: production
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url
      BETTER_AUTH_SECRET: !reset null
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      DATABASE_TLS_CA_PATH: /run/secrets/database_ca
      AUTHORIZATION_MTLS_CA_PATH: /run/secrets/service_ca
      AUTHORIZATION_MTLS_CERT_PATH: /run/secrets/authorization_server_cert
      AUTHORIZATION_MTLS_KEY_PATH: /run/secrets/authorization_server_key
      AUTHORIZATION_HEALTHCHECK_CA_PATH: /run/secrets/service_ca
      AUTHORIZATION_HEALTHCHECK_CERT_PATH: /run/secrets/authorization_healthcheck_client_cert
      AUTHORIZATION_HEALTHCHECK_KEY_PATH: /run/secrets/authorization_healthcheck_client_key
    volumes: !reset []
    secrets:
      - authorization_healthcheck_client_cert
      - authorization_healthcheck_client_key
      - authorization_server_cert
      - authorization_server_key
      - better_auth_secret
      - database_ca
      - database_url
      - service_ca
    pids_limit: 128
    cpus: 1
    mem_limit: 512m

  backend:
    <<: *node-hardening
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must come from the verified production build}
    build: !reset null
    environment:
      NODE_ENV: production
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url
      RABBITMQ_URL: !reset null
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      S3_ACCESS_KEY_ID: !reset null
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY: !reset null
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      DATABASE_TLS_CA_PATH: /run/secrets/database_ca
      RABBITMQ_TLS_CA_PATH: /run/secrets/service_ca
      AUTH_SERVICE_CA_PATH: /run/secrets/service_ca
      AUTH_SERVICE_CERT_PATH: /run/secrets/backend_client_cert
      AUTH_SERVICE_KEY_PATH: /run/secrets/backend_client_key
      LLM_GATEWAY_CA_PATH: /run/secrets/service_ca
      LLM_GATEWAY_CERT_PATH: /run/secrets/backend_client_cert
      LLM_GATEWAY_KEY_PATH: /run/secrets/backend_client_key
      LLM_GATEWAY_HMAC_KEY_FILE: /run/secrets/llm_hmac_key
    volumes: !reset []
    secrets:
      - backend_client_cert
      - backend_client_key
      - database_ca
      - database_url
      - llm_hmac_key
      - rabbitmq_url
      - s3_access_key_id
      - s3_secret_access_key
      - service_ca
    pids_limit: 192
    cpus: 2
    mem_limit: 1g

  media_worker:
    <<: *node-hardening
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must come from the verified production build}
    build: !reset null
    deploy: !reset null
    environment:
      NODE_ENV: production
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url
      RABBITMQ_URL: !reset null
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      S3_ACCESS_KEY_ID: !reset null
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY: !reset null
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      DATABASE_TLS_CA_PATH: /run/secrets/database_ca
      RABBITMQ_TLS_CA_PATH: /run/secrets/service_ca
    volumes: !reset []
    secrets:
      - database_ca
      - database_url
      - rabbitmq_url
      - s3_access_key_id
      - s3_secret_access_key
      - service_ca
    pids_limit: 128
    cpus: 0.5
    mem_limit: 512m

  llm_gateway:
    <<: *node-hardening
    image: ${LLM_GATEWAY_IMAGE:?LLM_GATEWAY_IMAGE must come from the verified production build}
    build: !reset null
    environment:
      NODE_ENV: production
      LLM_GATEWAY_TLS_CA_PATH: /run/secrets/service_ca
      LLM_GATEWAY_TLS_CERT_PATH: /run/secrets/llm_gateway_server_cert
      LLM_GATEWAY_TLS_KEY_PATH: /run/secrets/llm_gateway_server_key
      LLM_GATEWAY_HEALTHCHECK_CERT_PATH: /run/secrets/llm_gateway_healthcheck_client_cert
      LLM_GATEWAY_HEALTHCHECK_KEY_PATH: /run/secrets/llm_gateway_healthcheck_client_key
      LLM_GATEWAY_HMAC_KEY_FILE: /run/secrets/llm_hmac_key
    volumes: !reset []
    secrets:
      - llm_gateway_healthcheck_client_cert
      - llm_gateway_healthcheck_client_key
      - llm_gateway_server_cert
      - llm_gateway_server_key
      - llm_hmac_key
      - service_ca
    pids_limit: 128
    cpus: 0.5
    mem_limit: 256m

  frontend:
    <<: *production-defaults
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must come from the verified production build}
    build: !reset null
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=1777
    pids_limit: 128
    cpus: 0.5
    mem_limit: 256m

  nginx:
    <<: *production-defaults
    image: ${NGINX_IMAGE:?NGINX_IMAGE must come from the verified production build}
    build: !reset null
    ports: !override
      - ${HTTPS_PORT:-443}:8443
    volumes: !reset []
    configs:
      - source: nginx_production_config
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    secrets:
      - nginx_client_cert
      - nginx_client_key
      - public_tls_cert
      - public_tls_key
      - service_ca
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-check-certificate',
          '-q',
          '-O',
          '/dev/null',
          'https://127.0.0.1:8443/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=1777
    pids_limit: 128
    cpus: 0.5
    mem_limit: 256m

networks:
  internal-net:
    internal: true
  llm-runtime-net:
    internal: true

configs:
  nginx_production_config:
    file: ./nginx/production.conf
  rabbitmq_production_config:
    file: ./rabbitmq/production.conf

secrets:
  authorization_healthcheck_client_cert:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/authorization-healthcheck-client.crt
  authorization_healthcheck_client_key:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/authorization-healthcheck-client.key
  authorization_server_cert:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/authorization-server.crt
  authorization_server_key:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/authorization-server.key
  backend_client_cert:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/backend-client.crt
  backend_client_key:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/backend-client.key
  better_auth_secret:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/better-auth-secret
  database_ca:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/database-ca.crt
  database_direct_url:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/database-direct-url
  database_url:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/database-url
  nginx_client_cert:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/nginx-client.crt
  nginx_client_key:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/nginx-client.key
  llm_gateway_healthcheck_client_cert:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/llm-gateway-healthcheck-client.crt
  llm_gateway_healthcheck_client_key:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/llm-gateway-healthcheck-client.key
  llm_gateway_server_cert:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/llm-gateway-server.crt
  llm_gateway_server_key:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/llm-gateway-server.key
  llm_hmac_key:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/llm-hmac-key
  pgbouncer_server_cert:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/pgbouncer-server.crt
  pgbouncer_server_key:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/pgbouncer-server.key
  postgres_password:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/postgres-password
  postgres_server_cert:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/postgres-server.crt
  postgres_server_key:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/postgres-server.key
  public_tls_cert:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/public-tls.crt
  public_tls_key:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/public-tls.key
  rabbitmq_password:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/rabbitmq-password
  rabbitmq_server_cert:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/rabbitmq-server.crt
  rabbitmq_server_key:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/rabbitmq-server.key
  rabbitmq_url:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/rabbitmq-url
  rabbitmq_user:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/rabbitmq-user
  s3_access_key_id:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/s3-access-key-id
  s3_secret_access_key:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/s3-secret-access-key
  service_ca:
    file: ${ZTO_SECRETS_DIR:?ZTO_SECRETS_DIR is required}/service-ca.crt
