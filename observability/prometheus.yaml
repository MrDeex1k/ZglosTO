global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: zglosto-application
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: zglosto-collector
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: zglosto-rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
