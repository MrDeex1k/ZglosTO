extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  headers_setter/external:
    headers:
      - action: upsert
        key: ${env:OTEL_EXTERNAL_AUTH_HEADER_NAME}
        value_file: /run/secrets/otel_external_authorization

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  attributes/redact:
    actions:
      - { key: enduser.id, action: delete }
      - { key: user.id, action: delete }
      - { key: user.email, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: db.statement, action: delete }
      - { key: messaging.message.body, action: delete }
      - { key: gen_ai.prompt, action: delete }
      - { key: gen_ai.completion, action: delete }
  batch:
    send_batch_size: 512
    timeout: 2s

exporters:
  otlphttp/external:
    endpoint: ${env:OTEL_EXTERNAL_ENDPOINT}
    auth:
      authenticator: headers_setter/external
    compression: gzip
    sending_queue:
      enabled: true
      queue_size: 2048
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s

service:
  extensions: [health_check, headers_setter/external]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/external]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/external]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/external]
