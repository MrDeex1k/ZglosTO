location / {
    limit_except PUT OPTIONS {
        deny all;
    }

    # Resolve at request time so NGINX can also start in the external-S3 profile,
    # where the local RustFS service does not exist.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $rustfs_endpoint rustfs:9000;

    proxy_pass http://$rustfs_endpoint$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}
